apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasklist-backend
  labels:
    app: tasklist-backend
    appdynamics.app: TaskListAPI
    appdynamics.tier: Backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasklist-backend
  template:
    metadata:
      labels:
        app: tasklist-backend
        appdynamics.app: TaskListAPI
        appdynamics.tier: Backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/taskworks-solutions/tasklistapi:latest # Use the latest image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://tasklist-postgres:5432/tasklist
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: DB_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            # AppDynamics configuration
            - name: APPDYNAMICS_CONTROLLER_HOST_NAME
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: APPD_CONTROLLER_HOST
            - name: APPDYNAMICS_AGENT_ACCOUNT_NAME
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: APPD_ACCOUNT_NAME
            - name: APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: APPD_ACCESS_KEY
            - name: APPDYNAMICS_AGENT_APPLICATION_NAME
              value: "TaskListAPI"
            - name: APPDYNAMICS_AGENT_TIER_NAME
              value: "Backend"
            - name: APPDYNAMICS_AGENT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JAVA_TOOL_OPTIONS
              value: >
                -javaagent:/opt/appdynamics/java-agent/javaagent.jar
                -Dappdynamics.controller.ssl.enabled=true
                -Dappdynamics.controller.port=443
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30