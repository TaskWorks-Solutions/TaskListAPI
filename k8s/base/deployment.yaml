apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasklist-backend
  namespace: tasklist
  labels:
    app: tasklist-backend
    appdynamics.app: TaskListAPI
    appdynamics.tier: Backend
spec:
  revisionHistoryLimit: 2
  replicas: 2
  strategy: 
    type: RollingUpdate  # Changed from Recreate for zero-downtime deployments
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tasklist-backend
  template:
    metadata:
      labels:
        app: tasklist-backend
        appdynamics.app: TaskListAPI
        appdynamics.tier: Backend
    spec:
      # -----------------------------
      # Wait for DB before starting
      # -----------------------------
      initContainers:
        - name: db-wait
          image: postgres:15
          command:
            - sh
            - -c
            - |
              until pg_isready -h tasklist-postgres -p 5432; do
                echo "waiting for db..."
                sleep 5
              done
      containers:
        - name: backend
          image: ghcr.io/taskworks-solutions/tasklistapi:latest
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          # -----------------------------
          # Probes (proper startup sequence)
          # StartupProbe runs first and gates readiness/liveness
          # -----------------------------
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 90    # Start checking after 1.5 minutes
            periodSeconds: 10          # Check every 10 seconds
            timeoutSeconds: 30          # 30 seconds is enough for health endpoint
            failureThreshold: 120      # Allow up to 21 minutes total (60s + 120*10s)

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 0     # ⚠️ CRITICAL: Start immediately after startup succeeds
            periodSeconds: 10
            timeoutSeconds: 90
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 0     # ⚠️ CRITICAL: Start immediately after startup succeeds
            periodSeconds: 15
            timeoutSeconds: 90
            failureThreshold: 3

          # -----------------------------
          # Environment variables
          # -----------------------------
          env:
            - name: DB_URL
              value: jdbc:postgresql://tasklist-postgres:5432/tasklist
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: DB_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              value: docker

            # HikariCP Connection Pool Configuration
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "10"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "2"
            - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
              value: "20000"
            - name: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
              value: "300000"           # 5 minutes
            - name: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
              value: "600000"           # 10 minutes (CRITICAL - prevents stale connections)
            - name: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
              value: "30000"            # 30 seconds (keeps connections alive)
            - name: SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT
              value: "3000"             # 3 seconds
            - name: SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD
              value: "60000"            # 1 minute

            # AppDynamics Configuration
            - name: APPD_CONTROLLER_HOST
              value: theater202601042150029.saas.appdynamics.com
            - name: APPD_CONTROLLER_PORT
              value: "443"
            - name: APPD_ACCOUNT_NAME
              value: theater202601042150029
            - name: APPD_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: APPD_ACCESS_KEY
            - name: APPD_AGENT_JAR
              value: /opt/appdynamics/java-agent/javaagent.jar
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JAVA_OPTS
              value: >
                -Dappdynamics.agent.applicationName=TaskListAPI
                -Dappdynamics.agent.tierName=Backend
                -Dappdynamics.agent.reuse.nodeName=true
                -Dappdynamics.agent.reuse.nodeName.prefix=Backend_Node
                -Dappdynamics.agent.logs.dir=/opt/appdynamics/java-agent/logs
                -Dappdynamics.controller.ssl.enabled=true