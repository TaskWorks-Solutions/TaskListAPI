apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasklist-backend
  namespace: tasklist
  labels:
    app: tasklist-backend
    appdynamics.app: TaskListAPI
    appdynamics.tier: Backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tasklist-backend
  template:
    metadata:
      labels:
        app: tasklist-backend
        appdynamics.app: TaskListAPI
        appdynamics.tier: Backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/taskworks-solutions/tasklistapi:latest
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            periodSeconds: 15
            failureThreshold: 30
          env:
            - name: DB_URL
              value: jdbc:postgresql://tasklist-postgres:5432/tasklist
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: DB_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: APPD_CONTROLLER_HOST
              value: "theater202601042150029.saas.appdynamics.com"
            - name: APPD_CONTROLLER_PORT
              value: "443"
            - name: APPD_ACCOUNT_NAME
              value: "theater202601042150029"
            - name: APPD_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: appd-access-secret
                  key: access-key
            - name: APPD_AGENT_JAR
              value: "/opt/appdynamics/java-agent/javaagent.jar"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JAVA_OPTS
              value: >
                -Dappdynamics.agent.applicationName=TaskListAPI
                -Dappdynamics.agent.tierName=Backend
                -Dappdynamics.agent.reuse.nodeName=true
                -Dappdynamics.agent.reuse.nodeName.prefix=Backend_Node
                -Dappdynamics.agent.logs.dir=/opt/appdynamics/java-agent/logs
                -Dappdynamics.controller.ssl.enabled=true