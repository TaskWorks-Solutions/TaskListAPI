apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasklist-backend
  namespace: tasklist
  labels:
    app: tasklist-backend
    appdynamics.app: TaskListAPI
    appdynamics.tier: Backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasklist-backend
  template:
    metadata:
      labels:
        app: tasklist-backend
        appdynamics.app: TaskListAPI
        appdynamics.tier: Backend
    spec:
      # -----------------------------
      # Wait for DB before starting
      # -----------------------------
      initContainers:
        - name: db-wait
          image: postgres:15
          command:
            - sh
            - -c
            - |
              until pg_isready -h tasklist-postgres -p 5432; do
                echo "waiting for db..."
                sleep 5
              done
      containers:
        - name: backend
          image: ghcr.io/taskworks-solutions/tasklistapi:latest
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          # -----------------------------
          # Probes
          # -----------------------------
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # -----------------------------
          # Environment variables
          # -----------------------------
          env:
            - name: DB_URL
              value: jdbc:postgresql://tasklist-postgres:5432/tasklist
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasklist-secrets
                  key: DB_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: APPD_CONTROLLER_HOST
              value: theater202601042150029.saas.appdynamics.com
            - name: APPD_CONTROLLER_PORT
              value: "443"
            - name: APPD_ACCOUNT_NAME
              value: theater202601042150029
            - name: APPD_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: appd-access-secret
                  key: access-key
            - name: APPD_AGENT_JAR
              value: /opt/appdynamics/java-agent/javaagent.jar
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JAVA_OPTS
              value: >
                -Dappdynamics.agent.applicationName=TaskListAPI
                -Dappdynamics.agent.tierName=Backend
                -Dappdynamics.agent.reuse.nodeName=true
                -Dappdynamics.agent.reuse.nodeName.prefix=Backend_Node
                -Dappdynamics.agent.logs.dir=/opt/appdynamics/java-agent/logs
                -Dappdynamics.controller.ssl.enabled=true
