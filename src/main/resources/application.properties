spring.application.name=TaskListAPI

# ---------------- Database ----------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tasklist}
spring.datasource.username=${DB_USERNAME:tasklist_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------- JPA ----------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hibernate will auto-detect dialect if not specified
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------- Flyway ----------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---------------- Server ----------------
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ---------------- Spring MVC ----------------
spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=true

# ---------------- OpenAPI/Swagger ----------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.syntaxHighlight.activate=true

# ---------------- Actuator ----------------
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.defaults.enabled=true

# Optional: Reduce startup failures due to AppDynamics instrumentation
management.endpoint.health.group.probes.include=db

# ---------------- Logging ----------------
logging.level.org.springframework.web=INFO
logging.level.com.example.TaskListAPI=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
