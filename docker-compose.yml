services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: tasklist-postgres
    environment:
      POSTGRES_DB: tasklist
      POSTGRES_USER: ${DB_USERNAME:-tasklist_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - tasklist-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tasklist_user} -d tasklist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend Application (Spring Boot)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasklist-backend
    environment:
      # Database Connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tasklist
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-tasklist_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      SPRING_PROFILES_ACTIVE: prod

      # AppDynamics Agent Configuration
      APPDYNAMICS_AGENT_APPLICATION_NAME: "TaskListAPI"
      APPDYNAMICS_AGENT_TIER_NAME: "Backend"
      
      # FIX: Instead of ${HOSTNAME}, we use the Reuse/Prefix logic
      # This allows the agent to auto-name itself (e.g., Backend_TaskAPI_1)
      APPDYNAMICS_AGENT_REUSE_NODE_NAME: "true"
      APPDYNAMICS_AGENT_REUSE_NODE_NAME_PREFIX: "Backend_TaskAPI"
      
      APPDYNAMICS_CONTROLLER_HOST_NAME: "theater202601042150029.saas.appdynamics.com"
      APPDYNAMICS_CONTROLLER_PORT: 443
      APPDYNAMICS_CONTROLLER_SSL_ENABLED: "true"
      APPDYNAMICS_AGENT_ACCOUNT_NAME: "theater202601042150029"
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: "x5nmpxeaod5g"

      # Spring Boot Actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tasklist-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  tasklist-network:
    driver: bridge